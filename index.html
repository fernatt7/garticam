<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>garticam</title>
  </head>
  <body>

    <div id="app" class="container">
      <div class="video-wrap">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="landmarks" width="640" height="480"></canvas>
        <canvas id="canvas" width="640" height="480"></canvas>
        <div id="pointer-effects" aria-hidden="true">
          <span class="trail-dot"></span>
          <span class="trail-dot"></span>
          <span class="trail-dot"></span>
          <span class="trail-dot"></span>
          <span class="trail-dot"></span>
          <span class="trail-dot"></span>
          <span class="finger-glow"></span>
        </div>
        <div id="mode-status" aria-live="polite">DRAWING ON</div>

        <div class="toolbar">
          <button id="undo" type="button">Undo</button>
          <button id="clear" type="button">Clear</button>
          <button id="eraser" type="button">Eraser</button>

          <div class="colorfield" style="background: black;"></div>
          <div class="colorfield" style="background: red;"></div>
          <div class="colorfield" style="background: green;"></div>
          <div class="colorfield" style="background: blue;"></div>
          <div class="colorfield" style="background: yellow;"></div>

          <input class="colorfield" type="color" aria-label="Choose drawing color">
          <input id="widthRange" type="range" min="2" max="40" value="5" aria-label="Brush size">
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
